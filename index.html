<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 Reasons Why I Love You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 35px 20px;
            box-shadow: 0 0 50px rgba(255, 75, 110, 0.25);
            overflow: hidden;
        }

        /* Dynamic Background Overlay */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.65;
            transition: background-image 0.7s ease-in-out;
            transform: scale(1.03);
            filter: brightness(0.8) contrast(1.1);
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: space-between;
        }

        /* Header Bar */
        .header-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            justify-content: center;
            margin-top: 5px;
        }

        .header-title {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .quiz-btn-mini {
            background: rgba(255, 65, 108, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(16px);
        }

        /* Frosted Glass Card */
        .glass-card {
            width: 100%;
            background: rgba(15, 15, 25, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6),
                        inset 0 0 15px rgba(255, 255, 255, 0.15),
                        0 0 25px rgba(255, 105, 135, 0.35);
            margin: auto 0;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .reason-number {
            font-size: 0.85rem;
            font-weight: 800;
            color: #ff758c;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.6);
        }

        .reason-text {
            font-size: 1.55rem;
            font-weight: 800;
            line-height: 1.35;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            background: linear-gradient(135deg, #ffffff 40%, #ffccd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Clean Fade Animation */
        .pop-anim {
            animation: fadeIn 0.35s ease-in-out forwards;
        }

        @keyframes fadeIn {
            0% { transform: scale(0.92); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Glass Romantic Button */
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.5);
            transition: all 0.2s ease;
            margin-bottom: 5px;
        }

        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }

        /* Floating Hearts Container */
        .heart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 3s linear forwards;
            opacity: 0.9;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.3) rotate(360deg); opacity: 0; }
        }

        /* Love Match Modal */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 20;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.15);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(255, 65, 108, 0.4);
            width: 100%;
        }

        .modal-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #ff758c;
            font-weight: 800;
        }

        .match-score {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 20px #ff416c;
            margin: 10px 0;
        }

        .modal-close-btn {
            background: #ff416c;
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 700;
            margin-top: 15px;
            cursor: pointer;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="bg-overlay" id="bg"></div>
        <div class="heart-container" id="heart-box"></div>

        <div class="content">
            <div class="header-bar">
                <div class="header-title">22 Reasons Why I Love You 🤍🧿</div>
                <button class="quiz-btn-mini" onclick="openMatchModal()">Match 💖</button>
            </div>

            <div class="glass-card" id="card">
                <div class="reason-number" id="num">FOR MY SPECIAL ONE</div>
                <div class="reason-text" id="reason">Tap the button below to feel my love... ❤️✨</div>
            </div>

            <button class="btn" onclick="nextReason()">Tap For Next Reason ✨</button>
        </div>

        <!-- Love Match Modal -->
        <div class="modal-overlay" id="modal">
            <div class="modal-card">
                <div class="modal-title">Our Destiny Compatibility 💖</div>
                <div class="match-score">100%</div>
                <p style="font-size: 0.95rem; line-height: 1.4; color: #ffe6ea;">
                    You & Me are a match made in heaven. Forever & Always! ♾️❤️
                </p>
                <button class="modal-close-btn" onclick="closeMatchModal()">Close ✨</button>
            </div>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const reasons = [
            { num: "Reason #01", text: "Your smile that lights up my entire world 💖😍", bg: "Riya1.jpg" },
            { num: "Reason #02", text: "The adorable way you laugh at my silly jokes 🥰✨", bg: "Riya2.jpg" },
            { num: "Reason #03", text: "Your pure, kind, and beautiful heart ❤️🥺", bg: "Riya3.jpg" },
            { num: "Reason #04", text: "How deeply you care without saying a single word 🌸💫", bg: "Riya4.jpg" },
            { num: "Reason #05", text: "The magical way you look right into my eyes 🥺❤️", bg: "Riya5.jpg" },
            { num: "Reason #06", text: "Your soothing voice that calms all my stress 💕🎧", bg: "Riya6.jpg" },
            { num: "Reason #07", text: "Your honesty and purity in everything you do 🤌🥺", bg: "Riya7.jpg" },
            { num: "Reason #08", text: "Those sparkling eyes that hold my entire galaxy ✨👀", bg: "Riya8.jpg" },
            { num: "Reason #09", text: "How you stay by my side through thick and thin 🫀😍", bg: "Riya9.jpg" },
            { num: "Reason #10", text: "Your infinite patience with all my mood swings 🕊️🤍", bg: "Riya10.jpg" },
            { num: "Reason #11", text: "Your warm hugs that feel like coming back home 🫀😭", bg: "Riya11.jpg" },
            { num: "Reason #12", text: "The way you constantly support all my big dreams 🤝🚀", bg: "Riya12.jpg" },
            { num: "Reason #13", text: "How patiently you listen to my endless talks 🫶🥺", bg: "Riya13.jpg" },
            { num: "Reason #14", text: "Your cute and childish silliness that makes me smile 🤪❤️", bg: "Riya14.jpg" },
            { num: "Reason #15", text: "The gentle touch that gives me butterflies every time 🦋✨", bg: "Riya15.jpg" },
            { num: "Reason #16", text: "Your warm and loving nature that heals everything 🔥💖", bg: "Riya16.jpg" },
            { num: "Reason #17", text: "The adorable way you get emotional over tiny things 🥺💖", bg: "Riya17.jpg" },
            { num: "Reason #18", text: "Your cute random messages that instantly brighten my day 📱💕", bg: "Riya18.jpg" },
            { num: "Reason #19", text: "Our cozy late-night conversations under the stars 🤭🌙", bg: "Riya19.jpg" },
            { num: "Reason #20", text: "How safe, calm, and peaceful I feel when I am with you 🛡️❤️", bg: "Riya20.jpg" },
            { num: "Reason #21", text: "Your generous heart that forgives so easily 😍❤️", bg: "Riya21.jpg" },
            { num: "Reason #22", text: "Simply EVERYTHING about you... You are my forever! ♾️💖", bg: "Riya22.jpg" }
        ];

        let index = -1;

        // Floating Hearts Generator
        function spawnHearts() {
            const heartBox = document.getElementById('heart-box');
            const heartEmojis = ['❤️', '💖', '✨', '💕', '🌸', '🦋'];

            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('div');
                heart.classList.add('floating-heart');
                heart.innerText = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 85 + 5 + '%';
                heart.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
                heartBox.appendChild(heart);

                setTimeout(() => { heart.remove(); }, 3500);
            }
        }

        // Main Next Reason Logic
        function nextReason() {
            const music = document.getElementById('bg-music');
            if (music.paused) {
                music.play().catch(e => console.log(e));
            }

            index = (index + 1) % reasons.length;

            const card = document.getElementById('card');
            card.classList.remove('pop-anim');
            void card.offsetWidth; 
            card.classList.add('pop-anim');

            document.getElementById('num').innerText = reasons[index].num;
            document.getElementById('reason').innerText = reasons[index].text;
            document.getElementById('bg').style.backgroundImage = `url('${reasons[index].bg}')`;

            spawnHearts();

            // Fire Confetti Fireworks on Last Reason (#22)
            if (index === 21) {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        // Love Match Modal Controls
        function openMatchModal() {
            document.getElementById('modal').style.display = 'flex';
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.5 } });
        }

        function closeMatchModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
  </html>
